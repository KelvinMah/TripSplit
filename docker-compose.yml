services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tripsplit
      POSTGRES_PASSWORD: tripsplit
      POSTGRES_DB: tripsplit
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tripsplit"]
      interval: 3s
      retries: 20
    volumes:
      - tripsplit_db:/var/lib/postgresql/data
  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://tripsplit:tripsplit@db:5432/tripsplit
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  tripsplit_db:
